<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ai商業·多巴胺研究室</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  /* ------------------------------------------------------------------
     獲客中繼頁 —— 使用者不該停在這裡。
     任務只有兩件：記下來源、立刻關掉自己回到 LINE。
     2026-09-04 緊急修復：舊版是診斷頁，學生掃完卡在畫面上進不了 OA。
     ------------------------------------------------------------------ */
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000; color:#fff; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    padding:32px 24px; text-align:center;
  }
  .dot {
    width:44px; height:44px; border-radius:50%;
    border:3px solid rgba(181,255,88,.25); border-top-color:#B5FF58;
    animation:spin .9s linear infinite; margin-bottom:20px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { font-size:19px; font-weight:900; margin-bottom:8px; }
  p  { font-size:14.5px; color:#9AA0A6; line-height:1.7; }
  a.btn {
    display:none; margin-top:22px; background:#B5FF58; color:#000;
    text-decoration:none; font-weight:900; font-size:16px;
    padding:14px 28px; border-radius:12px;
  }
</style>
</head>
<body>

<div class="dot" id="spin"></div>
<h1 id="msg">正在帶你進入研究室…</h1>
<p id="sub">請稍候，不用做任何動作</p>
<a class="btn" id="fallback" href="https://line.me/R/ti/p/@810nuidc">點這裡進入聊天室</a>

<script>
var LIFF_ID = "2011388150-mVH54YNv";
var 後端網址 = "https://expert-funnel.vercel.app/api/line/liff";
var OA_連結  = "https://line.me/R/ti/p/@810nuidc";   // 多巴胺 OA 聊天室

/** 來源代號：?s=yt 直接帶，或從 LINE 導回時藏在 liff.state 裡 */
function 取出來源() {
  var q = new URLSearchParams(location.search);
  if (q.get("s")) return q.get("s");
  var st = q.get("liff.state");
  if (st) {
    var m = decodeURIComponent(st).match(/[?&]s=([^&]+)/);
    if (m) return m[1];
  }
  return "";
}

/** 顯示保底出口：關不掉視窗時，至少給一個能點的按鈕，不要讓人卡死 */
function 顯示保底() {
  document.getElementById("spin").style.display = "none";
  document.getElementById("msg").textContent = "已經完成登記";
  document.getElementById("sub").textContent = "點下面的按鈕回到聊天室";
  document.getElementById("fallback").style.display = "inline-block";
}

/** 送使用者進 OA 聊天室。
 *  2026-09-04 修正：原本用 liff.closeWindow()，但關掉只是回到「他掃碼之前的地方」，
 *  不會進聊天室。獲客路徑要的是「人落在 OA 對話裡看到歡迎訊息」，所以改成直接導向。 */
function 收工() {
  try {
    location.replace(OA_連結);
    // 導不過去（極少數舊版 LINE）時，2 秒後給可點的出口
    setTimeout(顯示保底, 2000);
    return;
  } catch (e) { /* 忽略，走保底 */ }
  顯示保底();
}

liff.init({ liffId: LIFF_ID })
  .then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return; }   // 導去登入，回來會再跑一次
    return liff.getProfile().then(function (p) {
      // 🚨 不要 await 這個 fetch。網路慢的時候會把使用者卡在這頁。
      // 送不送得出去都不影響他進 LINE，體驗優先。
      try {
        fetch(後端網址, {
          method: "POST",
          mode: "no-cors",
          keepalive: true,                    // 視窗關掉後請求仍會送出
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            來自: "落地頁",
            使用者ID: p.userId,
            來源: 取出來源()
          })
        });
      } catch (e) { /* 記錄失敗不擋人 */ }
      收工();
    });
  })
  .catch(function () {
    // init 失敗（網路、設定、外部瀏覽器）也不能讓人卡住
    顯示保底();
  });

// 最後一道保險：不管上面發生什麼事，5 秒後一定要給出口
setTimeout(function () {
  if (document.getElementById("fallback").style.display !== "inline-block") 顯示保底();
}, 5000);
</script>
</body>
</html>
